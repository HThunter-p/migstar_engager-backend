services:
  - type: web
    name: migstar-engager-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/settings/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: migstar-engager-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://migstarengager-frontend.vercel.app,https://migstarengager.vercel.app

databases:
  - name: migstar-engager-db
    databaseName: migstar_engager
    user: migstar_engager_user
    plan: free
    postgresMajorVersion: "16"
